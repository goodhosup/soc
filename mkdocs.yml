      - SoC 설계 흐름: design/flow.md
      - IP와 통합: design/ip-integration.md
      - 검증과 에뮬레이션: design/verification.md
      - 파운드리와 공정: design/foundry.md
      - 패키징: design/packaging.md
      - 시험과 양산: design/test.md
  - 소프트웨어와 실무:
      - software/index.md
      - Android BSP 구조: software/android-bsp.md
      - Linux 커널과 SoC 지원: software/linux-kernel.md
      - 성능 분석 도구: software/profiling.md
      - 벤치마크 읽는 법: software/benchmarks.md
      - 개발 보드로 실습: software/dev-boards.md
  - 최신 동향:
      - next/index.md
      - 2nm 세대와 GAA 경쟁: next/2nm.md
      - Arm PC와 노트북 SoC: next/arm-pc.md
      - 차량용 SoC: next/automotive.md
      - RISC-V의 부상: next/riscv.md
  - 레퍼런스:
      - reference/index.md
      - 칩셋 세대 인덱스: reference/chipset-index.md
      - 제조사별 비교: reference/vendor-compare.md
